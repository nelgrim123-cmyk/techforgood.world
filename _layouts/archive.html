---
layout: default
---
<header class="page-header">
  <div class="wrap"><h1>{{ page.title }}</h1></div>
</header>
<section class="latest" style="padding-top: 32px;">
  <div class="wrap">
    <div class="article-list">
      {% for post in site.posts %}
      <a class="article-row" href="{{ post.url | relative_url }}">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>
        <div>
          <span class="tag">{{ post.categories | first | replace: '-', ' ' }}</span>
          <h3>{{ post.title }}</h3>
          <p>{{ post.excerpt | strip_html | truncatewords: 28 }}</p>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
