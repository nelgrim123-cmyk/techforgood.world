---
layout: default
---
<article>
  <header class="post-header">
    <div class="wrap">
      <p class="eyebrow">{{ page.categories | first | replace: '-', ' ' }}</p>
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
        {% if page.read_time %}<span>{{ page.read_time }} min read</span>{% endif %}
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
