title: "Tech for Good"
tagline: "How technology can improve the impact of healthcare"
description: >-
  Notes on how digital health, AI and data are reshaping care delivery,
  the pharma industry and biomedical research.
url: "https://techforgood.world"
baseurl: ""

markdown: kramdown
permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
